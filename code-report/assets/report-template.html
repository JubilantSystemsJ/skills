<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light dark; --bg:#fbfcfe; --panel:#fff; --ink:#1f2937; --muted:#5b6472; --line:#d7dde6; --accent:#2856c7; --accent-soft:#eaf0ff; --good:#176b3a; --bad:#a52336; --warn:#8a5200; }
    @media (prefers-color-scheme: dark) { :root { --bg:#101318; --panel:#171b22; --ink:#eef2f7; --muted:#aeb7c4; --line:#37404d; --accent:#9bb7ff; --accent-soft:#202e52; --good:#7bd49c; --bad:#ff9aaa; --warn:#f2bd69; } }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    a { color:var(--accent); }
    .shell { max-width:1180px; margin:0 auto; padding:24px; display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:28px; }
    main { min-width:0; }
    header { border-bottom:1px solid var(--line); padding:18px 0 24px; margin-bottom:28px; }
    h1 { font-size:clamp(2rem,4vw,3.4rem); line-height:1.08; margin:.2em 0; letter-spacing:-.035em; }
    h2 { margin-top:2.6rem; line-height:1.2; border-top:1px solid var(--line); padding-top:1.2rem; }
    h3 { line-height:1.3; }
    .lede { color:var(--muted); font-size:1.12rem; max-width:75ch; }
    .provenance,.source-note { color:var(--muted); font-size:.9rem; }
    nav { position:sticky; top:16px; align-self:start; border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:14px; }
    nav strong { display:block; margin-bottom:8px; }
    nav a { display:block; padding:4px 0; text-decoration:none; }
    .cluster { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-size:.72rem; margin:14px 0 3px; }
    .callout,.visual,.decision { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:14px 16px; margin:18px 0; }
    .visual { border-left-color:var(--good); overflow:auto; }
    .visual svg { max-width:100%; height:auto; }
    .decision { border-left-color:var(--warn); }
    .evidence { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:.78rem; color:var(--muted); }
    details { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin:12px 0; }
    summary { cursor:pointer; font-weight:650; }
    code,pre { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    pre { white-space:pre-wrap; overflow:auto; background:#111827; color:#e5e7eb; padding:14px; border-radius:8px; }
    .quiz { border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:18px; margin:18px 0; }
    .quiz-option { display:block; margin:8px 0; padding:10px; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
    .quiz-option:focus-within { outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent); }
    .quiz-option input { margin-right:8px; }
    .quiz-feedback { margin-top:12px; padding:10px; border-radius:8px; }
    .quiz-feedback.good { color:var(--good); border:1px solid var(--good); }
    .quiz-feedback.bad { color:var(--bad); border:1px solid var(--bad); }
    button { border:0; border-radius:7px; background:var(--accent); color:white; padding:9px 14px; font:inherit; cursor:pointer; }
    button:focus-visible,a:focus-visible,summary:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    .skip { position:absolute; left:-9999px; }
    .skip:focus { left:12px; top:12px; z-index:10; background:var(--panel); padding:8px; }
    footer { border-top:1px solid var(--line); margin-top:40px; padding:18px 0; color:var(--muted); font-size:.9rem; }
    @media (max-width:800px) { .shell { display:block; padding:16px; } nav { position:static; margin-bottom:24px; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } * { transition:none !important; } }
    @media print { nav { display:none; } .shell { display:block; max-width:none; } details { break-inside:avoid; } }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <main id="content">
      <header>
        <p class="provenance">{{PROVENANCE}}</p>
        <h1>{{TITLE}}</h1>
        <p class="lede">{{LEDE}}</p>
      </header>
      {{CONTENT}}
      <footer>Generated as a self-contained offline document. Research, evidence, decisions, and validation are recorded in the companion source artifacts.</footer>
    </main>
    <nav aria-label="Report contents">{{TOC}}</nav>
  </div>
  <script>
    (() => {
      function shuffle(items) {
        for (let i = items.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
        return items;
      }
      function sameSet(left, right) {
        return left.length === right.length && left.every((value) => right.includes(value));
      }
      document.querySelectorAll('[data-quiz]').forEach((quiz) => {
        const options = quiz.querySelector('.quiz-options');
        const nodes = Array.from(options.children);
        shuffle(nodes).forEach((node) => options.appendChild(node));
        const expected = JSON.parse(quiz.dataset.correct || '[]');
        const feedback = quiz.querySelector('.quiz-feedback');
        quiz.querySelector('button').addEventListener('click', () => {
          const selected = Array.from(quiz.querySelectorAll('input:checked')).map((input) => Number(input.value)).sort((a,b) => a-b);
          const correct = sameSet(selected, expected);
          feedback.className = `quiz-feedback ${correct ? 'good' : 'bad'}`;
          feedback.textContent = correct ? 'Correct. ' + quiz.dataset.feedback : 'Not quite. ' + quiz.dataset.feedback;
          feedback.hidden = false;
        });
      });
    })();
  </script>
</body>
</html>
